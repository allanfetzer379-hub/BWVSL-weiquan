<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>案件管理｜台灣網路詐騙維權中心</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #152b52;
      --blue: #234e9c;
      --ink: #1c2e49;
      --muted: #4f6280;
      --line: #dae3ee;
      --paper: #f4f7fb;
      --gold: #f0ce89;
      --danger: #922d24;
    }
    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 16px/1.55 "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", sans-serif;
    }
    a { color: var(--blue); }
    :focus-visible { outline: 3px solid #557dd0; outline-offset: 3px; }
    h1, h2, p { margin: 0; }
    h1, h2 { line-height: 1.25; }
    h1 { font-size: clamp(1.6rem, 4vw, 2.15rem); }
    h2 { font-size: 1.3rem; }
    .bar { background: var(--navy); color: white; }
    .shell { width: min(1150px, calc(100% - 32px)); margin-inline: auto; }
    .bar .shell, .console-head, .toolbar, .pages, .dialog-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .bar .shell { min-height: 66px; padding-block: 10px; }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: white;
      font-weight: 750;
      text-decoration: none;
    }
    .brand svg { width: 26px; height: 26px; color: var(--gold); flex: none; }
    main { padding-block: clamp(20px, 5vw, 45px); }
    .panel {
      background: white;
      border: 1px solid var(--line);
      border-radius: 15px;
      padding: clamp(15px, 3vw, 27px);
      box-shadow: 0 9px 32px #152b520c;
    }
    .login { max-width: 450px; margin-inline: auto; }
    .subtle { color: var(--muted); font-size: .9rem; }
    .login .subtle, .fields, .toolbar, .table-title, .pages { margin-top: 13px; }
    .fields { display: grid; gap: 12px; }
    .field { min-width: 0; }
    .field label { display: block; margin-bottom: 5px; font-weight: 750; }
    input, select, textarea, button { font: inherit; }
    input, select, textarea {
      width: 100%;
      border: 1px solid #becde1;
      border-radius: 8px;
      padding: 9px 11px;
      color: var(--ink);
      background: white;
    }
    input, select, button { min-height: 44px; }
    textarea { resize: vertical; }
    .button {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 8px 13px;
      font-weight: 750;
      cursor: pointer;
    }
    .primary { color: white; background: var(--blue); }
    .primary:hover:not(:disabled) { background: #173e86; }
    .secondary { color: var(--blue); background: white; border-color: #bdcce2; }
    .secondary:hover:not(:disabled) { background: #edf3ff; }
    .button:disabled { opacity: .55; cursor: default; }
    .login .primary { width: 100%; }
    .warning, .status-text { margin-top: 11px; }
    .warning { color: var(--danger); font-weight: 700; }
    .status-text { color: #175b38; }
    .status-text:empty, .warning:empty { display: none; }
    .console-head { align-items: flex-start; }
    .console-head p { margin-top: 5px; word-break: break-word; }
    .console-nav, .setting-actions, .row-action-buttons, .copy-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .console-nav { margin-top: 14px; }
    .console-nav .button[aria-pressed="true"] { color: white; background: var(--blue); }
    .settings-grid { display: grid; gap: 15px; margin-top: 17px; }
    .settings-grid fieldset { min-width: 0; margin: 0; padding: 14px; border: 1px solid var(--line); border-radius: 9px; }
    .settings-grid legend { padding-inline: 5px; font-weight: 750; }
    .settings-grid h3 { margin: 0; font-size: 1rem; }
    .setting-actions { margin-top: 10px; }
    .setting-actions .field { flex: 0 1 150px; }
    .pixel-fields { display: grid; gap: 14px; margin-block: 12px; }
    .pixel-list { display: grid; gap: 6px; margin-top: 7px; }
    .pixel-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .pixel-row > input { width: auto; min-width: 140px; flex: 1; }
    .pixel-toggle { display: inline-flex; align-items: center; gap: 5px; min-height: 44px; }
    .pixel-toggle input { width: 20px; height: 20px; min-height: 0; }
    .toolbar { justify-content: flex-start; align-items: end; margin-block: 18px; }
    .search { flex: 2 1 215px; }
    .status-filter { flex: 1 1 145px; max-width: 245px; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .table-title { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .table-frame { margin-top: 11px; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-size: .86rem; }
    tbody tr:hover { background: #f7faff; }
    td { vertical-align: middle; font-size: .9rem; overflow-wrap: anywhere; }
    .tabular { font-variant-numeric: tabular-nums; }
    .status-pill {
      display: inline-block;
      border-radius: 999px;
      padding: 3px 9px;
      background: #eaf1ff;
      color: #174792;
      font-size: .8rem;
      font-weight: 750;
      white-space: nowrap;
    }
    .status-pill[data-status="in_review"], .status-pill[data-status="contacted"] { color: #68490e; background: #fff3cc; }
    .status-pill[data-status="line_added"], .status-pill[data-status="closed"] { color: #175633; background: #dff5e8; }
    .status-pill[data-status="invalid"] { color: #7f3029; background: #fbeae7; }
    .table-button { white-space: nowrap; }
    .empty { padding: 19px 0; color: var(--muted); }
    .pages .subtle { margin-right: auto; }
    dialog {
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: clamp(16px, 4vw, 26px);
      width: min(530px, calc(100% - 24px));
      max-height: calc(100dvh - 24px);
    }
    dialog::backdrop { background: #0d193bb0; }
    .details { margin: 12px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; }
    .details dt { font-weight: 750; }
    .details dd { margin: 0; overflow-wrap: anywhere; }
    .copy-summary { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 12px; }
    .copy-summary .field { margin-bottom: 8px; }
    .copy-summary .subtle { margin-top: 5px; }
    .dialog-actions { justify-content: end; margin-top: 15px; }
    @media (max-width: 780px) {
      .table-frame table, .table-frame tbody { display: block; }
      .table-frame thead { position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
      .table-frame tbody { display: grid; gap: 9px; }
      .table-frame tr { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
      .table-frame td { display: block; border: 0; padding: 4px 5px; }
      .table-frame td[data-label]::before { display: block; content: attr(data-label); font-size: .77rem; color: var(--muted); }
      .table-frame .row-actions { grid-column: 1 / -1; }
      .table-button { flex: 1 1 auto; }
    }
    @media (max-width: 380px) {
      .shell { width: calc(100% - 24px); }
      .toolbar-actions .button { width: 100%; }
      .toolbar-actions { flex: 1 0 100%; }
    }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="./config.js"></script>
</head>
<body>
  <header class="bar">
    <div class="shell">
      <a class="brand" href="./index.html">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M16 3 27 7v8c0 6-4 10-11 14C9 25 5 21 5 15V7l11-4Z"/>
          <path d="m11 16 4 4 7-8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        台灣網路詐騙維權中心
      </a>
      <button type="button" class="button secondary" id="logout" hidden>登出</button>
    </div>
  </header>

  <main class="shell">
    <section class="panel login" id="login-panel" aria-labelledby="login-title">
      <h1 id="login-title">案件管理登入</h1>
      <p class="subtle">請使用已獲授權的工作人員帳號登入。</p>
      <form class="fields" id="login-form" method="post">
        <div class="field">
          <label for="email">電子郵件</label>
          <input id="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">密碼</label>
          <input id="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="button primary" id="login-button" disabled>登入</button>
      </form>
      <p class="warning" id="login-message" role="alert"></p>
      <noscript><p class="warning">請啟用 JavaScript 後登入。</p></noscript>
    </section>

    <section class="panel" id="workspace" aria-labelledby="workspace-title" hidden>
      <header class="console-head">
        <div>
          <h1 id="workspace-title" tabindex="-1">案件管理</h1>
          <p class="subtle" id="operator"></p>
        </div>
      </header>
      <nav class="console-nav" aria-label="後台功能">
        <button type="button" id="show-cases" class="button secondary" aria-controls="cases-view" aria-pressed="true">案件管理</button>
        <button type="button" id="show-settings" class="button secondary" aria-controls="settings-view" aria-pressed="false">系統設定</button>
      </nav>

      <div id="cases-view">
      <form class="toolbar" id="case-filter">
        <div class="field search">
          <label for="search">搜尋案件</label>
          <input id="search" type="search" placeholder="案件編號、稱呼或聯絡電話" maxlength="64" spellcheck="false" autocomplete="off">
        </div>
        <div class="field status-filter">
          <label for="filter-status">處理狀態</label>
          <select id="filter-status"><option value="">全部狀態</option></select>
        </div>
        <div class="toolbar-actions">
          <button type="submit" class="button primary">搜尋</button>
          <button type="button" class="button secondary" id="reload">重新整理</button>
          <button type="button" class="button secondary" id="export" disabled>匯出本頁 CSV</button>
        </div>
      </form>

      <div class="table-title">
        <h2 id="list-title">案件列表</h2>
        <span class="subtle" id="row-count" role="status"></span>
      </div>
      <p class="warning" id="list-error" role="alert"></p>
      <p class="warning" id="list-copy-error" role="alert"></p>
      <p class="status-text" id="save-announcement" role="status"></p>
      <div class="table-frame">
        <table id="case-table" aria-labelledby="list-title" role="table">
          <thead role="rowgroup"><tr role="row">
            <th scope="col" role="columnheader">案件編號</th>
            <th scope="col" role="columnheader">收件時間</th>
            <th scope="col" role="columnheader">稱呼</th>
            <th scope="col" role="columnheader">聯絡電話</th>
            <th scope="col" role="columnheader">受騙金額</th>
            <th scope="col" role="columnheader">處理狀態</th>
            <th scope="col" role="columnheader">甲方編號</th>
            <th scope="col" role="columnheader">案件操作</th>
          </tr></thead>
          <tbody id="cases" role="rowgroup"></tbody>
        </table>
        <p class="empty" id="list-empty" hidden>沒有符合條件的案件。</p>
      </div>
      <nav class="pages" aria-label="案件頁次">
        <span class="subtle" id="pagination"></span>
        <button type="button" class="button secondary" id="previous" disabled>上一頁</button>
        <button type="button" class="button secondary" id="next" disabled>下一頁</button>
      </nav>
      </div>

      <section id="settings-view" class="settings-grid" aria-labelledby="settings-title" hidden>
        <h2 id="settings-title">系統設定</h2>
        <p id="settings-load-status" class="subtle" role="status"></p>
        <button type="button" id="retry-settings" class="button secondary" hidden>重新讀取設定</button>
        <form id="site-settings-form" class="fields" novalidate>
          <fieldset id="site-settings-fields" disabled>
            <legend>LINE 官方帳號</legend>
            <div class="field">
              <label for="settings-line-url">LINE 連結</label>
              <input id="settings-line-url" type="url" maxlength="500" placeholder="https://lin.ee/… 或 https://line.me/…" spellcheck="false" autocomplete="off">
            </div>
            <div class="setting-actions">
              <button type="button" class="button secondary" id="test-line-link">測試連結</button>
            </div>
            <p id="line-test-message" class="warning" role="alert"></p>
          </fieldset>

          <fieldset id="pixel-settings-fields" disabled>
            <legend>廣告像素</legend>
            <p class="subtle">可先儲存 Pixel ID 與啟用狀態。正式收件頁目前未啟用廣告追蹤。</p>
            <p id="settings-total-cases" class="subtle"></p>
            <div class="pixel-fields">
              <section aria-labelledby="meta-title">
                <h3 id="meta-title">Facebook／Meta Pixel</h3>
                <div id="meta-pixels" class="pixel-list"></div>
                <div class="setting-actions"><button type="button" id="add-meta" class="button secondary">新增 Meta Pixel</button></div>
              </section>
              <section aria-labelledby="tiktok-title">
                <h3 id="tiktok-title">TikTok Pixel</h3>
                <div id="tiktok-pixels" class="pixel-list"></div>
                <div class="setting-actions"><button type="button" id="add-tiktok" class="button secondary">新增 TikTok Pixel</button></div>
              </section>
            </div>
            <button type="submit" id="save-site-settings" class="button primary">儲存 LINE 與像素設定</button>
          </fieldset>
          <p id="site-save-error" class="warning" role="alert"></p>
          <p id="site-save-status" class="status-text" role="status"></p>
        </form>

        <form id="partner-settings-form">
          <fieldset id="partner-settings-fields" disabled>
            <legend>甲方編號</legend>
            <p class="subtle" id="current-partner-next"></p>
            <div class="setting-actions">
              <div class="field">
                <label for="partner-next">下一個起始號</label>
                <input type="number" id="partner-next" inputmode="numeric" min="1" max="9999" step="1" required>
              </div>
              <button type="submit" id="save-partner-next" class="button primary">儲存起始號</button>
            </div>
            <p id="partner-save-error" class="warning" role="alert"></p>
            <p id="partner-save-status" class="status-text" role="status"></p>
          </fieldset>
        </form>
      </section>
    </section>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="editor-form">
      <h2 id="editor-title">編輯案件</h2>
      <dl class="details">
        <dt>案件編號</dt><dd id="detail-case-number"></dd>
        <dt>收件時間</dt><dd id="detail-created-at"></dd>
        <dt>稱呼</dt><dd id="detail-name"></dd>
        <dt>聯絡電話</dt><dd id="detail-phone"></dd>
        <dt>受騙金額</dt><dd id="detail-amount"></dd>
        <dt>甲方編號</dt><dd id="detail-partner-number"></dd>
      </dl>
      <section class="copy-summary" aria-label="交單資料">
        <div class="field">
          <label for="summary-preview">交單摘要預覽</label>
          <textarea id="summary-preview" rows="3" readonly></textarea>
          <p class="subtle" id="summary-hint" hidden>複製時會分配甲方編號。</p>
        </div>
        <div class="copy-actions">
          <button type="button" id="detail-copy-partner" class="button secondary">複製甲方編號</button>
          <button type="button" id="detail-copy-summary" class="button secondary">複製交單摘要</button>
        </div>
        <p id="detail-copy-error" class="warning" role="alert"></p>
        <p id="detail-copy-status" class="status-text" role="status"></p>
      </section>
      <div class="fields">
        <div class="field">
          <label for="case-status">處理狀態</label>
          <select id="case-status" required></select>
        </div>
        <div class="field">
          <label for="case-note">內部備註</label>
          <textarea id="case-note" maxlength="2000" rows="4"></textarea>
        </div>
      </div>
      <p id="save-error" class="warning" role="alert"></p>
      <div class="dialog-actions">
        <button type="button" class="button secondary" id="close-editor">關閉</button>
        <button type="submit" class="button primary" id="save">儲存</button>
      </div>
    </form>
  </dialog>

  <dialog id="manual-copy" aria-labelledby="manual-copy-title">
    <h2 id="manual-copy-title">手動複製</h2>
    <p class="subtle" id="manual-copy-message"></p>
    <div class="field" style="margin-top: 10px;">
      <label for="manual-copy-text">複製內容</label>
      <textarea id="manual-copy-text" rows="3" readonly></textarea>
    </div>
    <form method="dialog" class="dialog-actions"><button class="button primary">關閉</button></form>
  </dialog>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      "use strict";
      const byId = (id) => document.getElementById(id);
      const statusNames = {
        new: "待聯絡",
        contacted: "已聯絡",
        line_added: "已加入 LINE",
        in_review: "處理中",
        closed: "已結案",
        invalid: "無效案件"
      };
      const pageSize = 25;
      const dateFormat = new Intl.DateTimeFormat("zh-Hant-TW", {
        dateStyle: "short", timeStyle: "short", timeZone: "Asia/Taipei"
      });
      const tableName = "wei_quan_cases";
      const columnNames = "id,case_number,created_at,name,phone,amount,status,note,partner_number";
      const loginPanel = byId("login-panel");
      const loginButton = byId("login-button");
      const loginMessage = byId("login-message");
      const workspace = byId("workspace");
      const logout = byId("logout");
      const table = byId("case-table");
      const body = byId("cases");
      const editor = byId("editor");
      const save = byId("save");
      const exportButton = byId("export");
      const previous = byId("previous");
      const next = byId("next");
      const filterStatus = byId("filter-status");
      const caseStatus = byId("case-status");
      const note = byId("case-note");
      const closeEditor = byId("close-editor");
      const siteSettingsForm = byId("site-settings-form");
      const partnerSettingsForm = byId("partner-settings-form");
      const lineInput = byId("settings-line-url");
      const partnerNextInput = byId("partner-next");
      const settingsView = byId("settings-view");
      const settingsLoadStatus = byId("settings-load-status");
      const retrySettings = byId("retry-settings");
      const manualCopy = byId("manual-copy");
      const manualCopyText = byId("manual-copy-text");
      const detailCopyPartner = byId("detail-copy-partner");
      const detailCopySummary = byId("detail-copy-summary");
      const summaryPreview = byId("summary-preview");
      const caseDate = (value) => value ? dateFormat.format(new Date(value)) : "—";
      const isStaff = (user) => user?.app_metadata?.wei_quan_admin === true;
      const pixelFormats = { meta: /^\d{8,20}$/, tiktok: /^[A-Z0-9]{8,32}$/ };
      const rowCopyControls = new Map();
      const cachedPartnerNumbers = new Map();
      const pendingCopies = new Set();

      let staff = null;
      let cases = [];
      let selectedCase = null;
      let page = 0;
      let listRequest = 0;
      let settingsReady = false;
      let settingsBusy = false;
      let partnerNext = null;
      let partnerCounterRevision = 0;

      for (const [value, label] of Object.entries(statusNames)) {
        filterStatus.add(new Option(label, value));
        caseStatus.add(new Option(label, value));
      }

      const config = window.WEIQUAN_CONFIG;
      const supabaseUrl = typeof config?.supabaseUrl === "string" ? config.supabaseUrl.trim().replace(/\/$/, "") : "";
      const publishableKey = typeof config?.publishableKey === "string" ? config.publishableKey.trim() : "";
      const validUrl = /^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(supabaseUrl);
      if (!validUrl || !publishableKey.startsWith("sb_publishable_")) {
        loginMessage.textContent = "尚未設定案件管理服務，請聯絡網站管理人員。";
        return;
      }
      if (!window.supabase?.createClient) {
        loginMessage.textContent = "登入元件目前無法載入，請確認網路連線後重新整理。";
        return;
      }

      let client;
      try {
        client = window.supabase.createClient(supabaseUrl, publishableKey, {
          auth: { persistSession: false, autoRefreshToken: true, detectSessionInUrl: false }
        });
      } catch {
        loginMessage.textContent = "案件管理服務的設定無法使用，請聯絡網站管理人員。";
        return;
      }

      function clearWorkspace() {
        ++listRequest;
        ++partnerCounterRevision;
        staff = null;
        cases = [];
        selectedCase = null;
        page = 0;
        body.replaceChildren();
        rowCopyControls.clear();
        cachedPartnerNumbers.clear();
        pendingCopies.clear();
        if (manualCopy.open) manualCopy.close();
        manualCopyText.value = "";
        settingsReady = false;
        settingsBusy = false;
        partnerNext = null;
        siteSettingsForm.reset();
        partnerSettingsForm.reset();
        for (const platform of Object.keys(pixelFormats)) byId(platform + "-pixels").replaceChildren();
        for (const id of ["settings-load-status", "line-test-message", "site-save-error", "site-save-status",
          "partner-save-error", "partner-save-status", "current-partner-next", "settings-total-cases"]) {
          byId(id).textContent = "";
        }
        retrySettings.hidden = true;
        updateSettingsControls();
        showView(false);
        workspace.hidden = true;
        logout.hidden = true;
        loginPanel.hidden = false;
        byId("operator").textContent = "";
        byId("list-copy-error").textContent = "";
        byId("save-announcement").textContent = "";
        byId("login-form").reset();
        byId("case-filter").reset();
        for (const id of ["detail-case-number", "detail-created-at", "detail-name", "detail-phone", "detail-amount",
          "detail-partner-number", "detail-copy-error", "detail-copy-status"]) {
          byId(id).textContent = "";
        }
        summaryPreview.value = "";
        byId("save-error").textContent = "";
        byId("editor-form").reset();
        if (editor.open) editor.close();
      }

      client.auth.onAuthStateChange((event, session) => {
        if (!staff) return;
        if (event === "SIGNED_OUT" || (event === "TOKEN_REFRESHED" && !isStaff(session?.user))) {
          clearWorkspace();
          loginMessage.textContent = "登入狀態已結束，請重新登入。";
        }
      });

      byId("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (loginButton.disabled) return;
        loginButton.disabled = true;
        loginButton.textContent = "登入中⋯";
        loginMessage.textContent = "";
        try {
          const { data, error } = await client.auth.signInWithPassword({
            email: byId("email").value.trim(),
            password: byId("password").value
          });
          if (error || !data?.session) throw new Error("登入失敗");
          if (!isStaff(data.user)) {
            await client.auth.signOut({ scope: "local" });
            loginMessage.textContent = "此帳號尚未取得案件管理權限。";
            return;
          }
          staff = data.user;
          loginPanel.hidden = true;
          workspace.hidden = false;
          logout.hidden = false;
          byId("operator").textContent = data.user.email || "已登入";
          byId("workspace-title").focus();
          await loadCases();
        } catch {
          loginMessage.textContent = "登入失敗，請確認電子郵件與密碼後再試一次。";
        } finally {
          byId("password").value = "";
          loginButton.disabled = false;
          loginButton.textContent = "登入";
        }
      });
      loginButton.disabled = false;

      logout.addEventListener("click", async () => {
        loginButton.disabled = true;
        clearWorkspace();
        try {
          const { error } = await client.auth.signOut({ scope: "local" });
          loginMessage.textContent = error ? "連線發生問題。工作畫面已關閉，請重新整理後再登入。" : "";
        } catch {
          loginMessage.textContent = "連線發生問題。工作畫面已關閉，請重新整理後再登入。";
        } finally {
          loginButton.disabled = false;
          byId("email").focus();
        }
      });

      function showView(showSettings) {
        byId("cases-view").hidden = showSettings;
        settingsView.hidden = !showSettings;
        byId("show-cases").setAttribute("aria-pressed", String(!showSettings));
        byId("show-settings").setAttribute("aria-pressed", String(showSettings));
        if (showSettings && !settingsReady) loadSettings();
      }

      function updateSettingsControls() {
        const disabled = !settingsReady || settingsBusy;
        for (const id of ["site-settings-fields", "pixel-settings-fields", "partner-settings-fields"]) {
          byId(id).disabled = disabled;
        }
        retrySettings.disabled = settingsBusy;
      }

      function cleanLineUrl(input) {
        const text = input.trim();
        if (!/^https:\/\/(?:lin\.ee|line\.me)\/[^/?#]/i.test(text) || /[\s\u0000-\u001f\u007f\\]/u.test(text)) return null;
        if (text.length > 500 || /@your_line_id/i.test(text)) return null;
        try {
          return new URL(text).href;
        } catch {
          return null;
        }
      }

      function appendPixel(platform, pixel = {}) {
        const name = platform === "meta" ? "Meta" : "TikTok";
        const row = document.createElement("div");
        row.className = "pixel-row";
        const input = document.createElement("input");
        input.type = "text";
        input.value = pixel.id ?? "";
        input.maxLength = platform === "meta" ? 20 : 32;
        input.autocomplete = "off";
        input.spellcheck = false;
        if (platform === "meta") input.inputMode = "numeric";
        input.setAttribute("aria-label", name + " Pixel ID");
        input.placeholder = name + " Pixel ID";
        const toggle = document.createElement("label");
        toggle.className = "pixel-toggle";
        const enabled = document.createElement("input");
        enabled.type = "checkbox";
        enabled.checked = pixel.enabled === true;
        toggle.append(enabled, "啟用");
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "button secondary";
        remove.textContent = "移除";
        remove.setAttribute("aria-label", "移除 " + name + " Pixel");
        remove.addEventListener("click", () => {
          row.remove();
          byId("add-" + platform).focus();
        });
        row.append(input, toggle, remove);
        byId(platform + "-pixels").append(row);
        return input;
      }

      function readPixels() {
        const pixels = [];
        for (const [platform, format] of Object.entries(pixelFormats)) {
          const seen = new Set();
          for (const row of byId(platform + "-pixels").children) {
            const input = row.querySelector('input[type="text"]');
            const id = input.value.trim().toUpperCase();
            const platformName = platform === "meta" ? "Meta" : "TikTok";
            if (!format.test(id) || seen.has(id)) {
              input.focus();
              const formatMessage = platform === "meta" ? "請輸入 8 至 20 位數字。" : "請輸入 8 至 32 位英文字母或數字。";
              throw new Error(platformName + " Pixel ID " + (seen.has(id) ? "有重複項目。" : formatMessage));
            }
            seen.add(id);
            pixels.push({ platform, id, enabled: row.querySelector('input[type="checkbox"]').checked });
          }
        }
        return pixels;
      }

      function showSavedPartnerNext(value) {
        if (value !== null && (!Number.isInteger(value) || value < 1 || value > 9999)) return;
        const previous = partnerNext;
        partnerNext = value;
        const inputContainsPrevious = partnerNextInput.value === String(previous ?? "");
        if (inputContainsPrevious) partnerNextInput.value = value ?? "";
        byId("current-partner-next").textContent = value === null
          ? "目前起始號之後沒有可用的編號。"
          : "下一筆未編號的案件將分配 " + formatPartnerNumber(value) + "。";
      }

      function renderSiteSettings(data) {
        lineInput.value = data.line_url ?? "";
        for (const platform of Object.keys(pixelFormats)) byId(platform + "-pixels").replaceChildren();
        for (const pixel of data.pixels) appendPixel(pixel.platform, pixel);
        byId("settings-total-cases").textContent = "成功收件共 " + data.total_cases + " 筆。";
      }

      async function loadSettings() {
        if (!staff || settingsBusy) return;
        const activeStaff = staff;
        settingsBusy = true;
        settingsLoadStatus.textContent = "載入設定中⋯";
        retrySettings.hidden = true;
        updateSettingsControls();
        try {
          const { data, error } = await client.rpc("get_wei_quan_admin_settings");
          if (staff !== activeStaff) return;
          if (error || !data || !Array.isArray(data.pixels)) throw new Error("settings unavailable");
          renderSiteSettings(data);
          showSavedPartnerNext(data.partner_next);
          settingsReady = true;
          settingsLoadStatus.textContent = "";
        } catch {
          if (staff !== activeStaff) return;
          settingsLoadStatus.textContent = "無法讀取設定。請稍候重新讀取。";
          retrySettings.hidden = false;
        } finally {
          if (staff === activeStaff) {
            settingsBusy = false;
            updateSettingsControls();
          }
        }
      }

      byId("show-cases").addEventListener("click", () => showView(false));
      byId("show-settings").addEventListener("click", () => showView(true));
      retrySettings.addEventListener("click", loadSettings);
      for (const platform of Object.keys(pixelFormats)) {
        byId("add-" + platform).addEventListener("click", () => appendPixel(platform).focus());
      }
      lineInput.addEventListener("input", () => { byId("line-test-message").textContent = ""; });
      byId("test-line-link").addEventListener("click", () => {
        const url = cleanLineUrl(lineInput.value);
        byId("line-test-message").textContent = url ? "" : "請輸入有效的 LINE 官方帳號連結。";
        if (url) window.open(url, "_blank", "noopener,noreferrer");
      });

      siteSettingsForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!staff || !settingsReady || settingsBusy) return;
        const activeStaff = staff;
        const errorMessage = byId("site-save-error");
        const status = byId("site-save-status");
        errorMessage.textContent = "";
        status.textContent = "";
        const rawLineUrl = lineInput.value.trim();
        const lineUrl = rawLineUrl ? cleanLineUrl(rawLineUrl) : null;
        if (rawLineUrl && !lineUrl) {
          errorMessage.textContent = "請輸入有效的 LINE 官方帳號連結。";
          lineInput.focus();
          return;
        }
        let pixels;
        try {
          pixels = readPixels();
        } catch (error) {
          errorMessage.textContent = error.message;
          return;
        }
        settingsBusy = true;
        updateSettingsControls();
        status.textContent = "儲存中⋯";
        try {
          const { data, error } = await client.rpc("save_wei_quan_admin_settings", { p_line_url: lineUrl, p_pixels: pixels });
          if (staff !== activeStaff) return;
          if (error || !data || !Array.isArray(data.pixels)) throw new Error("save failed");
          renderSiteSettings(data);
          status.textContent = "已儲存 LINE 與像素設定。";
        } catch {
          if (staff !== activeStaff) return;
          status.textContent = "";
          errorMessage.textContent = "無法儲存設定。請稍候再試。";
        } finally {
          if (staff === activeStaff) {
            settingsBusy = false;
            updateSettingsControls();
          }
        }
      });

      partnerSettingsForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!staff || !settingsReady || settingsBusy || !partnerSettingsForm.reportValidity()) return;
        const activeStaff = staff;
        const errorMessage = byId("partner-save-error");
        const status = byId("partner-save-status");
        errorMessage.textContent = "";
        status.textContent = "儲存中⋯";
        settingsBusy = true;
        ++partnerCounterRevision;
        updateSettingsControls();
        try {
          const { data, error } = await client.rpc("set_wei_quan_partner_next", { p_next: partnerNextInput.valueAsNumber });
          if (staff !== activeStaff) return;
          if (error || (data !== null && !Number.isInteger(data))) throw new Error("save failed");
          showSavedPartnerNext(data);
          partnerNextInput.value = data ?? "";
          status.textContent = "已儲存起始號。";
        } catch {
          if (staff !== activeStaff) return;
          status.textContent = "";
          errorMessage.textContent = "無法儲存起始號。請稍候再試。";
        } finally {
          if (staff === activeStaff) {
            ++partnerCounterRevision;
            settingsBusy = false;
            updateSettingsControls();
          }
        }
      });

      async function loadCases() {
        if (!staff) return;
        const sequence = ++listRequest;
        const countLabel = byId("row-count");
        const listError = byId("list-error");
        const empty = byId("list-empty");
        listError.textContent = "";
        countLabel.textContent = "載入中⋯";
        table.setAttribute("aria-busy", "true");
        empty.hidden = true;
        previous.disabled = true;
        next.disabled = true;
        exportButton.disabled = true;

        const search = byId("search").value.normalize("NFKC").trim();
        const cleanSearch = search.replace(/[^\p{L}\p{M}\p{N} +#@'-]/gu, "").trim();
        const phoneSearch = cleanSearch.replace(/[\s-]/g, "").replace(/^\+8869/, "09");
        let query = client.from(tableName).select(columnNames, { count: "exact" })
          .order("created_at", { ascending: false })
          .order("id", { ascending: false });
        if (filterStatus.value) query = query.eq("status", filterStatus.value);
        if (cleanSearch) {
          const filters = ["name.ilike.*" + cleanSearch + "*", "case_number.ilike.*" + cleanSearch + "*"];
          if (phoneSearch) filters.push("phone.ilike.*" + phoneSearch + "*");
          query = query.or(filters.join(","));
        }

        try {
          const { data, error, count } = await query.range(page * pageSize, (page + 1) * pageSize - 1);
          if (!staff || sequence !== listRequest) return;
          if (error) throw error;
          const pages = Math.max(1, Math.ceil((count ?? 0) / pageSize));
          if (page >= pages) {
            page = pages - 1;
            await loadCases();
            return;
          }
          cases = data ?? [];
          for (const record of cases) {
            if (cachedPartnerNumbers.has(record.id)) record.partner_number = cachedPartnerNumbers.get(record.id);
          }
          renderRows();
          countLabel.textContent = "共 " + (count ?? cases.length) + " 筆";
          byId("pagination").textContent = "第 " + (page + 1) + "／" + pages + " 頁";
          empty.hidden = cases.length > 0;
          previous.disabled = page === 0;
          next.disabled = page + 1 >= pages;
          exportButton.disabled = cases.length === 0;
        } catch {
          if (!staff || sequence !== listRequest) return;
          cases = [];
          rowCopyControls.clear();
          body.replaceChildren();
          countLabel.textContent = "";
          byId("pagination").textContent = "";
          listError.textContent = "無法讀取案件。請稍候重新整理，或重新登入。";
        } finally {
          if (sequence === listRequest) table.setAttribute("aria-busy", "false");
        }
      }

      function makeCell(label, value) {
        const td = document.createElement("td");
        td.dataset.label = label;
        td.setAttribute("role", "cell");
        td.textContent = value ?? "—";
        return td;
      }

      function formatPartnerNumber(value) {
        return Number.isInteger(value) && value >= 1 && value <= 9999 ? String(value).padStart(2, "0") : "";
      }

      function copySummaryText(record, partnerNumber) {
        return [
          "甲方編號：" + (formatPartnerNumber(partnerNumber) || "尚未分配"),
          "案件類型：網路詐騙維權",
          "受騙金額區間：" + record.amount
        ].join("\n");
      }

      function refreshCopyControls(record) {
        const assignedNumber = cachedPartnerNumbers.get(record.id) ?? record.partner_number;
        const label = formatPartnerNumber(assignedNumber) || "尚未分配";
        const pending = pendingCopies.has(record.id);
        const rowControls = rowCopyControls.get(record.id);
        if (rowControls) {
          rowControls.number.textContent = label;
          rowControls.button.disabled = pending;
          rowControls.button.textContent = pending ? "處理中⋯" : "複製甲方編號";
        }
        if (selectedCase?.id === record.id) {
          byId("detail-partner-number").textContent = label;
          summaryPreview.value = copySummaryText(record, assignedNumber);
          byId("summary-hint").hidden = Boolean(assignedNumber);
          detailCopyPartner.disabled = pending;
          detailCopySummary.disabled = pending;
        }
      }

      function startClipboardWrite(textPromise, immediateText) {
        const clipboard = navigator.clipboard;
        if (!clipboard?.writeText) return Promise.resolve(false);
        const simpleWrite = () => textPromise.then((text) => clipboard.writeText(text));
        if (!immediateText && window.ClipboardItem && clipboard.write) {
          try {
            const blob = textPromise.then((text) => new Blob([text], { type: "text/plain" }));
            blob.catch(() => {});
            return clipboard.write([new ClipboardItem({ "text/plain": blob })]).catch(simpleWrite).then(() => true, () => false);
          } catch {
            return simpleWrite().then(() => true, () => false);
          }
        }
        return (immediateText ? clipboard.writeText(immediateText) : simpleWrite()).then(() => true, () => false);
      }

      async function copyCaseData(record, summary, inEditor) {
        if (!staff || pendingCopies.has(record.id)) return;
        const activeStaff = staff;
        const counterRevision = partnerCounterRevision;
        const status = byId(inEditor ? "detail-copy-status" : "save-announcement");
        const errorMessage = byId(inEditor ? "detail-copy-error" : "list-copy-error");
        const currentNumber = cachedPartnerNumbers.get(record.id) ?? record.partner_number;
        const makeText = (number) => summary ? copySummaryText(record, number) : formatPartnerNumber(number);
        const current = () => staff === activeStaff && (!inEditor || selectedCase?.id === record.id);
        status.textContent = "";
        errorMessage.textContent = "";
        pendingCopies.add(record.id);
        refreshCopyControls(record);

        async function assignNumber() {
          const { data, error } = await client.rpc("assign_wei_quan_partner_number", { p_case_id: record.id });
          if (staff !== activeStaff || error || !formatPartnerNumber(data?.partner_number)) throw new Error("assignment failed");
          cachedPartnerNumbers.set(record.id, data.partner_number);
          if (settingsReady && counterRevision === partnerCounterRevision &&
              (data.partner_next === null || (partnerNext !== null && data.partner_next >= partnerNext))) {
            showSavedPartnerNext(data.partner_next);
          }
          refreshCopyControls(record);
          return makeText(data.partner_number);
        }

        const immediateText = formatPartnerNumber(currentNumber) ? makeText(currentNumber) : "";
        const textPromise = immediateText ? Promise.resolve(immediateText) : assignNumber();
        const clipboardWrite = startClipboardWrite(textPromise, immediateText);
        try {
          const text = await textPromise;
          const copied = await clipboardWrite;
          if (!current()) return;
          if (copied) {
            const number = formatPartnerNumber(cachedPartnerNumbers.get(record.id) ?? currentNumber);
            status.textContent = summary ? "已複製交單摘要（甲方編號 " + number + "）。" : "已複製甲方編號 " + number + "。";
          } else {
            byId("manual-copy-message").textContent = "請複製下方已選取的文字。";
            manualCopyText.value = text;
            if (!manualCopy.open) manualCopy.showModal();
            manualCopyText.focus();
            manualCopyText.select();
          }
        } catch {
          if (current()) errorMessage.textContent = "無法分配甲方編號，請確認起始號設定後再試。";
        } finally {
          if (staff === activeStaff) {
            pendingCopies.delete(record.id);
            refreshCopyControls(record);
          }
        }
      }

      function renderRows() {
        body.replaceChildren();
        rowCopyControls.clear();
        for (const record of cases) {
          const row = document.createElement("tr");
          row.setAttribute("role", "row");
          row.append(
            makeCell("案件編號", record.case_number),
            makeCell("收件時間", caseDate(record.created_at)),
            makeCell("稱呼", record.name),
            makeCell("聯絡電話", record.phone),
            makeCell("受騙金額", record.amount)
          );
          const statusCell = makeCell("處理狀態", "");
          const badge = document.createElement("span");
          badge.className = "status-pill";
          badge.dataset.status = record.status;
          badge.textContent = statusNames[record.status] ?? "未知狀態";
          statusCell.append(badge);
          const actions = makeCell("案件操作", "");
          actions.className = "row-actions";
          const actionButtons = document.createElement("div");
          actionButtons.className = "row-action-buttons";
          const button = document.createElement("button");
          button.type = "button";
          button.className = "button secondary table-button";
          button.textContent = "編輯案件";
          button.setAttribute("aria-label", "編輯案件 " + record.case_number);
          button.addEventListener("click", () => openEditor(record));
          const copyButton = document.createElement("button");
          copyButton.type = "button";
          copyButton.className = "button secondary table-button";
          copyButton.setAttribute("aria-label", "複製甲方編號，案件 " + record.case_number);
          copyButton.addEventListener("click", () => copyCaseData(record, false, false));
          actionButtons.append(button, copyButton);
          actions.append(actionButtons);
          const partnerCell = makeCell("甲方編號", "");
          partnerCell.className = "tabular";
          rowCopyControls.set(record.id, { number: partnerCell, button: copyButton });
          refreshCopyControls(record);
          row.append(statusCell, partnerCell, actions);
          body.append(row);
        }
      }

      function openEditor(record) {
        selectedCase = record;
        byId("detail-case-number").textContent = record.case_number;
        byId("detail-created-at").textContent = caseDate(record.created_at);
        byId("detail-name").textContent = record.name;
        byId("detail-phone").textContent = record.phone;
        byId("detail-amount").textContent = record.amount;
        caseStatus.value = record.status;
        note.value = record.note ?? "";
        byId("save-error").textContent = "";
        byId("detail-copy-error").textContent = "";
        byId("detail-copy-status").textContent = "";
        refreshCopyControls(record);
        editor.showModal();
      }

      detailCopyPartner.addEventListener("click", () => {
        if (selectedCase) copyCaseData(selectedCase, false, true);
      });
      detailCopySummary.addEventListener("click", () => {
        if (selectedCase) copyCaseData(selectedCase, true, true);
      });
      manualCopy.addEventListener("close", () => { manualCopyText.value = ""; });

      byId("case-filter").addEventListener("submit", (event) => {
        event.preventDefault();
        page = 0;
        loadCases();
      });
      filterStatus.addEventListener("change", () => { page = 0; loadCases(); });
      byId("reload").addEventListener("click", () => loadCases());
      previous.addEventListener("click", () => { page -= 1; loadCases(); });
      next.addEventListener("click", () => { page += 1; loadCases(); });

      closeEditor.addEventListener("click", () => editor.close());
      editor.addEventListener("cancel", (event) => {
        if (save.disabled) event.preventDefault();
      });
      editor.addEventListener("close", () => {
        selectedCase = null;
        byId("editor-form").reset();
        summaryPreview.value = "";
        byId("save-error").textContent = "";
      });

      byId("editor-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        if (!staff || !selectedCase || save.disabled) return;
        const record = selectedCase;
        const saveError = byId("save-error");
        const updatedStatus = caseStatus.value;
        const updatedNote = note.value.trim();

        save.disabled = true;
        closeEditor.disabled = true;
        caseStatus.disabled = true;
        note.disabled = true;
        save.textContent = "儲存中⋯";
        saveError.textContent = "";
        byId("save-announcement").textContent = "";

        try {
          let update = client.from(tableName).update({ status: updatedStatus, note: updatedNote })
            .eq("id", record.id).eq("status", record.status);
          update = record.note == null ? update.is("note", null) : update.eq("note", record.note);
          const { data, error } = await update.select("id").maybeSingle();
          if (!staff || selectedCase !== record) return;
          if (error) throw error;
          if (!data) {
            saveError.textContent = "這筆案件資料已更新，請先複製備註、關閉視窗並重新整理，再編輯最新資料。";
            return;
          }
          editor.close();
          byId("save-announcement").textContent = "已儲存案件 " + record.case_number;
          await loadCases();
        } catch {
          if (staff && selectedCase === record) saveError.textContent = "案件無法儲存，請稍候再試。";
        } finally {
          save.disabled = false;
          closeEditor.disabled = false;
          caseStatus.disabled = false;
          note.disabled = false;
          save.textContent = "儲存";
        }
      });

      function csvCell(value) {
        const raw = String(value ?? "");
        const safe = /^[\s\u200b\ufeff]*[=+\-@＝＋－＠]/u.test(raw) || /^[\t\r\n]/.test(raw)
          ? "'" + raw
          : raw;
        return '"' + safe.replace(/"/g, '""') + '"';
      }

      exportButton.addEventListener("click", () => {
        if (!staff || !cases.length) return;
        const data = [["案件編號", "收件時間（台灣）", "稱呼", "聯絡電話", "受騙金額", "處理狀態"]];
        for (const record of cases) {
          data.push([
            record.case_number, caseDate(record.created_at), record.name,
            "'" + record.phone, record.amount, statusNames[record.status] ?? ""
          ]);
        }
        const csv = new Blob(["\ufeff" + data.map((columns) => columns.map(csvCell).join(",")).join("\r\n")], {
          type: "text/csv;charset=utf-8"
        });
        const url = URL.createObjectURL(csv);
        const link = document.createElement("a");
        link.href = url;
        link.download = "案件列表-第" + (page + 1) + "頁.csv";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
    });
  </script>
</body>
</html>
